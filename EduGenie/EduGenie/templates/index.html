<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduGenie - your Gemini-powered study assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <h1 class="brand">EduGenie</h1>
      <p class="tagline">Study smarter with Google Gemini.</p>
      <nav id="task-list" class="tasks" aria-label="Choose a task"></nav>
    </aside>

    <main class="workspace">
      <form id="task-form" class="desk" autocomplete="off">
        <div class="desk-head">
          <h2 id="task-title"></h2>
          <p id="task-hint"></p>
        </div>
        <label class="sr-only" for="user-input" id="input-label">Your input</label>
        <textarea id="user-input" rows="5" maxlength="20000" required></textarea>
        <div class="examples" id="examples" aria-label="Example inputs"></div>
        <div class="actions">
          <button type="submit" id="submit-btn" class="primary"></button>
          <span class="keys">Ctrl + Enter to send</span>
        </div>
      </form>

      <section id="result" class="page" aria-live="polite" hidden></section>
    </main>
  </div>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
